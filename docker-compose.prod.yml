---
services:

  nginx:
    image: nginx:alpine
    container_name: ezshell-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/ssl-validation:/var/www/ssl-validation:ro
    depends_on:
      - frontend-service
      - backend-service
    networks:
      - ezshell-network-dev
    restart: unless-stopped

  postgres-db:
    image: 625572953030.dkr.ecr.us-west-2.amazonaws.com/ezshell/database:latest
    container_name: ezshell-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5438:5432"
    networks:
      - ezshell-network-dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend-service:
    depends_on:
      - postgres-db
    image: 625572953030.dkr.ecr.us-west-2.amazonaws.com/ezshell/backend:latest
    container_name: backend-service
    hostname: backend-service
    env_file:
      - ./backend/.env
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - ezshell-network-dev

  frontend-service:
    depends_on:
      - postgres-db
    image: 625572953030.dkr.ecr.us-west-2.amazonaws.com/ezshell/frontend:latest
    container_name: frontend
    hostname: frontend
    env_file:
      - ./frontend/.env.local
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - ezshell-network-dev
    volumes:
      - /opt/application/ezshell-labs/frontend/storage:/app/storage:Z

networks:
  ezshell-network-dev:

volumes:
  postgres_data:
