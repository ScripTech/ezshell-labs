name: Service-Specific Builds

on:
  push:
    branches:
      - service-frontend
      - service-backend
      - service-database
      - service-lab-provisioner
  pull_request:
    branches:
      - service-frontend
      - service-backend
      - service-database
      - service-lab-provisioner

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY_FRONTEND: ezshell/frontend
  ECR_REPOSITORY_BACKEND: ezshell/backend
  ECR_REPOSITORY_DATABASE: ezshell/database
  ECR_REPOSITORY_LAB_PROVISIONER: ezshell/lab-provisioner

jobs:
  detect-service:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.detect.outputs.service }}
      should-build: ${{ steps.detect.outputs.should-build }}
    steps:
      - name: Detect service from branch name
        id: detect
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch name: $BRANCH_NAME"
          
          case $BRANCH_NAME in
            service-frontend)
              echo "service=frontend" >> $GITHUB_OUTPUT
              echo "should-build=true" >> $GITHUB_OUTPUT
              echo "Building: Frontend Service"
              ;;
            service-backend)
              echo "service=backend" >> $GITHUB_OUTPUT
              echo "should-build=true" >> $GITHUB_OUTPUT
              echo "Building: Backend Service"
              ;;
            service-database)
              echo "service=database" >> $GITHUB_OUTPUT
              echo "should-build=true" >> $GITHUB_OUTPUT
              echo "Building: Database Service"
              ;;
            service-lab-provisioner)
              echo "service=lab-provisioner" >> $GITHUB_OUTPUT
              echo "should-build=true" >> $GITHUB_OUTPUT
              echo "Building: Lab Provisioner Service"
              ;;
            *)
              echo "service=none" >> $GITHUB_OUTPUT
              echo "should-build=false" >> $GITHUB_OUTPUT
              echo "No service detected for branch: $BRANCH_NAME"
              ;;
          esac

  # Frontend Service Build
  build-frontend:
    runs-on: ubuntu-latest
    needs: detect-service
    if: needs.detect-service.outputs.service == 'frontend' && needs.detect-service.outputs.should-build == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run tests
        run: |
          cd frontend
          npm run lint
          # Add npm test when tests are available

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd frontend
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:latest .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

  # Backend Service Build
  build-backend:
    runs-on: ubuntu-latest
    needs: detect-service
    if: needs.detect-service.outputs.service == 'backend' && needs.detect-service.outputs.should-build == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run tests
        run: |
          cd backend
          npm run test
          npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:latest .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:latest

  # Database Service Build
  build-database:
    runs-on: ubuntu-latest
    needs: detect-service
    if: needs.detect-service.outputs.service == 'database' && needs.detect-service.outputs.should-build == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd database
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_DATABASE }}:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_DATABASE }}:latest .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_DATABASE }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_DATABASE }}:latest

  # Lab Provisioner Service Build
  build-lab-provisioner:
    runs-on: ubuntu-latest
    needs: detect-service
    if: needs.detect-service.outputs.service == 'lab-provisioner' && needs.detect-service.outputs.should-build == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: lab-provisioner/package-lock.json

      - name: Install dependencies
        run: |
          cd lab-provisioner
          npm ci

      - name: Run tests
        run: |
          cd lab-provisioner
          npm run test

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd lab-provisioner
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_LAB_PROVISIONER }}:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY_LAB_PROVISIONER }}:latest .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_LAB_PROVISIONER }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY_LAB_PROVISIONER }}:latest

  # Notification job
  notify-completion:
    runs-on: ubuntu-latest
    needs: [detect-service, build-frontend, build-backend, build-database, build-lab-provisioner]
    if: always() && needs.detect-service.outputs.should-build == 'true'
    
    steps:
      - name: Notify build completion
        run: |
          SERVICE="${{ needs.detect-service.outputs.service }}"
          echo "🚀 Build completed for service: $SERVICE"
          echo "✅ Branch: ${{ github.ref_name }}"
          echo "📝 Commit: ${{ github.sha }}"
          
          # Check job statuses
          FRONTEND_STATUS="${{ needs.build-frontend.result }}"
          BACKEND_STATUS="${{ needs.build-backend.result }}"
          DATABASE_STATUS="${{ needs.build-database.result }}"
          LAB_PROVISIONER_STATUS="${{ needs.build-lab-provisioner.result }}"
          
          case $SERVICE in
            frontend)
              echo "Frontend build status: $FRONTEND_STATUS"
              ;;
            backend)
              echo "Backend build status: $BACKEND_STATUS"
              ;;
            database)
              echo "Database build status: $DATABASE_STATUS"
              ;;
            lab-provisioner)
              echo "Lab Provisioner build status: $LAB_PROVISIONER_STATUS"
              ;;
          esac
