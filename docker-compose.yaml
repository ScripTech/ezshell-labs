---
services:

  postgres-db:
    image: postgres:latest
    container_name: ezshell-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    networks:
      - ezshell-network-dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend-service:
    depends_on:
      - postgres-db
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: backend-service
    hostname: backend-service
    environment:
      - LAB_SSH_HOST=shell-node
      - LAB_SSH_PORT=22
      - LAB_SSH_USERNAME=lab-user
      - LAB_SSH_PASSWORD=password
      - SSH_PRIVATE_KEY=key
      - SERVER_PORT=3001
    ports:
      - 3001:3001
    restart: unless-stopped
    networks:
      - ezshell-network-dev

  frontend-service:
    depends_on:
      - postgres-db
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: frontend
    hostname: frontend
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - ezshell-network-dev

networks:
  ezshell-network-dev:
    driver: bridge
volumes:
  postgres_data:
    driver: local
