---
services:

  nginx:
    image: nginx:alpine
    container_name: ezshell-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-service
      - backend-service
    networks:
      - ezshell-network-dev
    restart: unless-stopped

  postgres-db:
    build:
      context: .
      dockerfile: database/Dockerfile.db
    container_name: ezshell-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Optional: Create initial admin user
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ezshell.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123!}
    ports:
      - "5438:5432"
    networks:
      - ezshell-network-dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  backend-service:
    depends_on:
      postgres-db:
        condition: service_healthy
    image: backend-export:latest
    container_name: backend-service
    hostname: backend-service
    env_file:
      - ./backend/.env
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - ezshell-network-dev

  frontend-service:
    depends_on:
      postgres-db:
        condition: service_healthy
      backend-service:
        condition: service_started
    image: frontend-export:latest
    container_name: frontend
    hostname: frontend
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - ezshell-network-dev

networks:
  ezshell-network-dev:
    driver: bridge
volumes:
  postgres_data:
    driver: local
