---
services:

  nginx:
    image: nginx:alpine
    container_name: ezshell-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-service
      - backend-service
    networks:
      - ezshell-network-dev
    restart: unless-stopped

  postgres-db:
    image: postgres:latest
    container_name: ezshell-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5438:5432"
    networks:
      - ezshell-network-dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend-service:
    depends_on:
      - postgres-db
    image: backend-export:latest
    container_name: backend-service
    hostname: backend-service
    env_file:
      - ./backend/.env
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - ezshell-network-dev

  frontend-service:
    depends_on:
      - postgres-db
    image: frontend-export:latest
    container_name: frontend
    hostname: frontend
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - ezshell-network-dev

networks:
  ezshell-network-dev:
    driver: bridge
volumes:
  postgres_data:
    driver: local
